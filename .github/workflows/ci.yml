name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.26', '1.27']
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      # Core module: vet, race-enabled tests, and a benchmark print.
      # Benchmarks are printed, not gated — shared runners are too noisy
      # to gate on, and the numbers are what reviewers want to see.
      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: benchmarks
        run: go test -run=^$ -bench=. -benchmem -benchtime=200ms ./...

      # The spike is a separate module in the workspace; its correctness
      # and allocs-per-run tests keep the three books honest.
      - name: spike tests
        working-directory: ./spike
        run: |
          go vet ./...
          go test -race -count=1 ./...

      # The analyzer module is standalone (not in go.work): it keeps the
      # x/tools dep and its Go 1.26 floor out of the library modules. Its
      # fixture test also checks the go vet -vettool exit-status contract.
      - name: hotpathcheck tests
        if: matrix.go != '1.22'
        working-directory: ./cmd/hotpathcheck
        run: |
          GOWORK=off go vet ./...
          GOWORK=off go test -count=1 ./...
